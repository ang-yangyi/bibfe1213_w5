<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIBFE1213 Introduction to Generative AI Tools, Welcome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
      color: #fff;
      padding: 1rem;
    }
    .card {
      max-width: 700px;
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }
    .tag {
      display: inline-block;
      padding: 0.3rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.6rem; font-weight: 400; margin-bottom: 1.5rem; }
    .line { width: 80px; height: 4px; margin: 0 auto 1.5rem; background: #fff; border-radius: 2px; }
    p { font-size: 1.1rem; opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">BIBFE1213</span>
    <h1>Welcome to BIBFE1213</h1>
    <h2>Introduction to Generative AI Tools</h2>
    <div class="line"></div>
    <p>Explore, create and learn with the power of generative AI.</p>
  </main>
</body>
</html>
